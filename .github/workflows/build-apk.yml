
name: Build NOVA TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Files in repository:"
          ls -la
          echo "Checking for Gradle wrapper..."
          if [ ! -f ./gradlew ]; then
            echo "No gradlew file found at the repository root."
            echo "The Android project structure must be checked."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-TV-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
